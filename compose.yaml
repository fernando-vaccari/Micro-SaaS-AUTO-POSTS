services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/.data
    ports:
      - "${AUTOPOSTS_BIND_IP:-127.0.0.1}:${AUTOPOSTS_PORT:-8000}:8000"
    volumes:
      - autoposts-data:/app/.data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 256
    stop_grace_period: 720s

  caddy:
    image: caddy:2
    profiles: [public]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      AUTOPOSTS_DOMAIN: ${AUTOPOSTS_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
  autoposts-data:
