name: Validate AUTOPOSTS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate application and rendering
        run: python -m pytest -q
      - name: Validate frontend syntax
        run: node --check autoposts/static/app.js

      - name: Generate real Auto Posts MP4
        run: python -m scripts.generate_demo

      - name: Upload real MP4
        uses: actions/upload-artifact@v4
        with:
          name: autoposts-video-real
          path: artifacts/autoposts-demo.mp4
          if-no-files-found: error
          retention-days: 7

