name: Validate AUTOPOSTS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate application and rendering
        run: python -m pytest -q
      - name: Validate frontend syntax
        run: node --check autoposts/static/app.js
        
      - name: Generate MP4 artifact
        run: |
          mkdir -p artifacts
          ffmpeg -y \
            -f lavfi -i "color=c=blue:s=1080x1920:r=30" \
            -f lavfi -i "anullsrc=r=44100:cl=stereo" \
            -t 6 \
            -c:v libx264 \
            -preset ultrafast \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest \
            artifacts/autoposts-test.mp4

      - name: Upload MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: autoposts-video
          path: artifacts/autoposts-test.mp4
          retention-days: 7
          
