name: Validate AUTOPOSTS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate Vercel static delivery and Node gateway
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install locked dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate application and rendering
        run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - name: Identify failed regression tests
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report=Path('artifacts/pytest.xml')
          if report.exists():
              for case in ET.parse(report).iter('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      name=case.get('name','').split('[',1)[0]
                      print(f"::error title=Regression test failed::{case.get('classname','')}.{name}")
          PY
      - name: Validate frontend syntax
        run: |
          node --check autoposts/static/app.js
          node --check autoposts/static/studio-ui.js
          node --check autoposts/static/uploads.js

      - name: Generate real Auto Posts MP4
        run: python -m scripts.generate_demo

      - name: Upload real MP4
        uses: actions/upload-artifact@v4
        with:
          name: autoposts-video-real
          path: artifacts/autoposts-demo.mp4
          if-no-files-found: error
          retention-days: 7

