name: Processar mídia da fila autenticada
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autoposts-render-next
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar renderizador
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements.txt
      - name: Reservar, gerar, enviar ao B2 e confirmar
        env:
          AUTOPOSTS_API_URL: ${{ vars.AUTOPOSTS_API_URL }}
          AUTOPOSTS_API_SECRET: ${{ secrets.AUTOPOSTS_API_SECRET }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: python -m scripts.render_next
      # Mídia de clientes permanece privada no B2, nunca em artifacts públicos.
