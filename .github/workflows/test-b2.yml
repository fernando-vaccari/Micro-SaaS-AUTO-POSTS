name: Testar armazenamento Backblaze B2
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: b2-roundtrip-${{ github.repository }}
  cancel-in-progress: false
jobs:
  testar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Instalar dependências fixadas
        run: python -m pip install -r requirements.txt
      - name: Enviar, ler, verificar e excluir objeto privado
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: python -m scripts.test_b2
