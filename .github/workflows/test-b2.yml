name: Testar armazenamento Backblaze B2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar conexao Backblaze
        env:
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: |
          ENDPOINT="${B2_ENDPOINT#https://}"

          echo "Testando conexao HTTPS..."
          curl -sS -o /dev/null \
            --connect-timeout 10 \
            --max-time 20 \
            -w "HTTP: %{http_code}\n" \
            "https://$ENDPOINT"

      - name: Instalar biblioteca do Backblaze
        run: |
          python -m pip install --user --upgrade boto3 botocore urllib3
          python -c "import boto3, botocore; print('Boto3:', boto3.__version__, 'Botocore:', botocore.__version__)"

      - name: Testar envio e leitura de arquivo
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET_NAME: ${{ vars.B2_BUCKET_NAME }}
          B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
        run: |
          python - <<'PY'
          import os
          import boto3
          from urllib.parse import urlparse
          from botocore.config import Config
          from botocore.handlers import add_expect_header

          endpoint = os.environ["B2_ENDPOINT"].strip().strip('"').strip("'")

          if not endpoint.startswith("https://"):
              endpoint = "https://" + endpoint

          host = urlparse(endpoint).hostname or ""

          if not host.startswith("s3.") or not host.endswith(".backblazeb2.com"):
              raise ValueError("Endpoint B2 invalido")

          region = host.removeprefix("s3.").removesuffix(".backblazeb2.com")

          bucket = os.environ["B2_BUCKET_NAME"].strip().strip('"').strip("'")

          s3 = boto3.client(
              "s3",
              endpoint_url=endpoint,
              region_name=region,
              aws_access_key_id=os.environ["B2_KEY_ID"].strip(),
              aws_secret_access_key=os.environ["B2_APPLICATION_KEY"].strip(),
              config=Config(
                  s3={"addressing_style": "path"},
                  request_checksum_calculation="when_required",
                  connect_timeout=15,
                  read_timeout=30,
                  retries={"max_attempts": 2},
              ),
          )

          s3.meta.events.unregister("before-call.s3", add_expect_header)

          arquivo = "testes/conexao-autoposts.txt"

          print("Testando armazenamento...", flush=True)

          s3.put_object(
              Bucket=bucket,
              Key=arquivo,
              Body=b"Auto Posts conectado!",
              ContentType="text/plain",
          )

          print("Upload realizado!", flush=True)

          resposta = s3.get_object(
              Bucket=bucket,
              Key=arquivo,
          )

          conteudo = resposta["Body"].read()

          assert conteudo == b"Auto Posts conectado!"

          print("Leitura confirmada!", flush=True)

          s3.delete_object(
              Bucket=bucket,
              Key=arquivo,
          )

          print("Arquivo de teste removido!", flush=True)
          print("BACKBLAZE B2 FUNCIONANDO!", flush=True)
          PY
